# Visor LOCAL (opcional) del report de estado de cargas (output/reports/latest.html).
#
# Ya NO es la fuente de nada: la publicación la hace Kayzen, y el report se le
# EMPUJA con un PUT desde el cron (run_all.sh → kaizen.gravityplayers.net/status/jobs).
# Ver design/PARA-TT-SCRAPER-report.md. Este nginx queda solo por si quieres mirar
# el report en local sin salir a internet: se ata a 127.0.0.1:8088 (no se expone),
# sin túnel ni cloudflared.
#
# Uso (desde /home/manu/tt-scrapper/deploy/web):
#   docker compose up -d        # arranca
#   docker compose down         # para
# El report se sirve en  http://127.0.0.1:8088/status/jobs/
services:
  report:
    image: nginx:1.27-alpine
    container_name: tt-report
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      # El report lo regenera el cron en output/reports; se monta solo-lectura.
      - ../../output/reports:/srv/reports:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

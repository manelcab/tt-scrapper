# Sirve el report de cargas en /status/jobs (index = latest.html, que el cron
# reescribe en cada pasada). Autocontenido: el HTML no referencia recursos
# externos, así que basta con servir el fichero.
server {
    listen 80;
    server_name _;

    # Sonda de salud para Cloudflare Tunnel / monitorización.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Raíz y /status/jobs → el último report.
    location = / { return 302 /status/jobs/; }
    location = /status/jobs { return 302 /status/jobs/; }

    location /status/jobs/ {
        alias /srv/reports/;
        index latest.html;
        autoindex off;
        default_type text/html;
        # El report cambia en cada ejecución: que no se cachee una versión vieja.
        add_header Cache-Control "no-store";
    }
}
